[project]
name = "rag1pilot"
version = "0.1.0"
description = "Conversational data analyst over CSV files in Google Drive, built with the Mistral Agents SDK"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-agents[bashkit,sessions-client,koyeb]==1.1.3",
    "pandas>=2.2,<3",
]

# The project is a workspace of its own, so `uv lock` writes its uv.lock here even inside another
# uv workspace, such as a monorepo checkout.
[tool.uv.workspace]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

